[workspace]
members = [".", "plugin-sdk", "plugins/example", "plugins/anime"]
resolver = "2"

[package]
name = "media-nav-api"
version = "0.1.0"
edition = "2024"

[dependencies]
plugin-sdk = { path = "plugin-sdk" }
actix-web = "4.13"
actix-web-httpauth = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bcrypt = "0.19"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
uuid = { version = "1.23", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
libloading = "0.9"
actix-governor = "0.10"
