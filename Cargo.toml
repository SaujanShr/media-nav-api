[package]
name = "media-nav-web"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.13.0"
actix-web-httpauth = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
bcrypt = "0.19.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
uuid = { version = "1.23.1", features = ["v4"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "migrate", "chrono"] }
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15"
