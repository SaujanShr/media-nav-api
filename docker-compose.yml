services:
  postgres:
    image: postgres:16-alpine
    container_name: media-nav-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: media_nav_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d media_nav_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
