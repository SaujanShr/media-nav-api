[package]
name = "plugin-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = { version = "1.0", optional = true }
extism-pdk  = { version = "1.4", optional = true }
urlencoding = { version = "2.1", optional = true }

[features]
guest = ["extism-pdk", "serde_json", "urlencoding"]
